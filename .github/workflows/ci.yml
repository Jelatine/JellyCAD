name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  VCPKG_VERSION: "2026.06.24"  # 对应 Jelatine/JellyCAD-vcpkg 的 Release tag: vcpkg-<版本>

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-2025-vs2026, ubuntu-24.04 ]

    runs-on: ${{ matrix.os }}

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 获取版本号
        shell: bash
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: 安装依赖(ubuntu)
        if: ${{ matrix.os=='ubuntu-24.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libltdl-dev libxcb*
          sudo apt-get install -y libx11* libgl1-mesa-dev libxrender-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev
          sudo apt-get install -y libxtst-dev pkg-config autoconf libtool bison libglu1-mesa-dev freeglut3-dev
          sudo apt-get install -y libfontconfig1-dev
          sudo apt-get install -y libgles2-mesa-dev libdrm-dev libgbm-dev libsm-dev libcups2-dev libmtdev-dev libts-dev
          sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0

      - name: 下载vcpkg产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "vcpkg-${VCPKG_VERSION}" -R Jelatine/JellyCAD-vcpkg -p "vcpkg-${RUNNER_OS}.tar.gz.part-*" -D vcpkg_dl
          cat vcpkg_dl/* | tar -xzf -
          rm -rf vcpkg_dl

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DTAG_VERSION="${{ steps.get_version.outputs.version }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config Release

      - name: Run Unit Tests
        run: |
          cd ${{github.workspace}}/build
          ctest -C Release --output-on-failure --verbose

      - name: 试运行(windows)
        if: ${{ matrix.os=='windows-2025-vs2026' }}
        run: |
          cd ${{github.workspace}}/build/bin
          ./JellyCAD --version

#      - name: 试运行(ubuntu)
#        if: ${{ matrix.os=='ubuntu-24.04' }}
#        run: |
#          export QT_DEBUG_PLUGINS=1
#          cd ${{github.workspace}}/build/bin
#          ./JellyCAD --version


  build_macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 获取版本号
        shell: bash
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: 下载vcpkg产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "vcpkg-${VCPKG_VERSION}" -R Jelatine/JellyCAD-vcpkg -p "vcpkg-${RUNNER_OS}.tar.gz.part-*" -D vcpkg_dl
          cat vcpkg_dl/* | tar -xzf -
          rm -rf vcpkg_dl

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build -DTAG_VERSION="${{ steps.get_version.outputs.version }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake -DBUILD_TESTS=ON
          cmake --build ${{github.workspace}}/build --config Release

      - name: Run Unit Tests
        run: |
          cd ${{github.workspace}}/build
          ctest -C Release --output-on-failure --verbose
