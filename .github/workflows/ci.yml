name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-2025-vs2026, ubuntu-24.04 ]

    runs-on: ${{ matrix.os }}

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 获取版本号
        shell: bash
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: 安装依赖(ubuntu)
        if: ${{ matrix.os=='ubuntu-24.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libltdl-dev libxcb*
          sudo apt-get install -y libx11* libgl1-mesa-dev libxrender-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev
          sudo apt-get install -y libxtst-dev pkg-config autoconf libtool bison libglu1-mesa-dev freeglut3-dev
          sudo apt-get install -y libfontconfig1-dev
          sudo apt-get install -y libgles2-mesa-dev libdrm-dev libgbm-dev libsm-dev libcups2-dev libmtdev-dev libts-dev
          sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0

      # 预设会自动下载 Jelatine/JellyCAD-vcpkg 的预编译依赖（版本见 fetch_vcpkg.cmake）
      - name: Configure CMake
        env:
          GH_TOKEN: ${{ github.token }}
        run: cmake --preset release -DTAG_VERSION="${{ steps.get_version.outputs.version }}" -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset release

      - name: Run Unit Tests
        run: ctest --test-dir build/release -C Release --output-on-failure --verbose

      - name: 试运行(windows)
        if: ${{ matrix.os=='windows-2025-vs2026' }}
        run: |
          cd ${{github.workspace}}/build/release/bin
          ./JellyCAD --version

#      - name: 试运行(ubuntu)
#        if: ${{ matrix.os=='ubuntu-24.04' }}
#        run: |
#          export QT_DEBUG_PLUGINS=1
#          cd ${{github.workspace}}/build/release/bin
#          ./JellyCAD --version


  build_macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 获取版本号
        shell: bash
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Configure CMake
        env:
          GH_TOKEN: ${{ github.token }}
        run: cmake --preset release -DTAG_VERSION="${{ steps.get_version.outputs.version }}" -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset release

      - name: Run Unit Tests
        run: ctest --test-dir build/release -C Release --output-on-failure --verbose
